name: php.yml

on:
  push:
    branches: [ "master", "create-workflow" ]
  pull_request:
    branches: [ "master", "create-workflow" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_DATABASE: test
          MYSQL_ROOT_PASSWORD: testrootpass
        ports:
          - 3306:3306
        volumes:
          - ${{ github.workspace }}/tests/data/simple.tsv:/tmp/simple.tsv
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.3
    
    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Wait for MySQL and setup test data
      env:
        DATABASE_NAME: test
        DATABASE_USERNAME: root          
        DATABASE_PASSWORD: testrootpass          
        DATABASE_ENDPOINT: 127.0.0.1
      run: |
        # Wait for MySQL to be ready
        until mysqladmin ping -h 127.0.0.1 -u root -ptestrootpass --silent; do
          echo 'Waiting for MySQL...'
          sleep 1
        done


        echo '"ls ${{ github.workspace }}/tests/data" :'
        ls ${{ github.workspace }}/tests/data
        # Create directory in MySQL container and copy test data
#        sudo cp tests/mysql-files/* /var/lib/mysql-files/data
