#        sudo ls -l /var/lib
#        echo
#        echo
#        echo "sudo ls -l /var/lib/mysql-files"
#        sudo ls -l /var/lib/mysql-files
#        echo
#        echo
        # echo "sudo ls /var/lib/mysql-files"
        # sudo ls -l /var/lib/mysql-files
        # sudo chown -R 1000:1000 /var/lib/mysql-files
               

        # echo ""
        # echo "list files in /var/lib/mysql-files:"
        # ls -la /var/lib/mysql-files
        
