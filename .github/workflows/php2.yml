    - name: Copy import files for mysql
      env:
        DATABASE_NAME: test
        DATABASE_USERNAME: root
        DATABASE_PASSWORD: root
        DATABASE_ENDPOINT: 127.0.0.1
      run: |
        sudo cp tests/data/* /var/lib/mysql-files

    - name: Copy php .env file
      run: |
        cp ${{ github.workspace }}/.github/workflows/.env ${{ github.workspace }}/.env

    - name: Run tests
      env:
        DATABASE_NAME: test
        DATABASE_USERNAME: root
        DATABASE_PASSWORD: root
        DATABASE_ENDPOINT: 127.0.0.1
      run: |
        ${{ github.workspace }}/vendor/bin/phpunit tests
